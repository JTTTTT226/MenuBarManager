name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS app
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build MenuBarManager.app
        run: ./scripts/build-app.sh

      - name: Check the app bundle
        run: |
          test -x MenuBarManager.app/Contents/MacOS/MenuBarManager
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' MenuBarManager.app/Contents/Info.plist)" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' MenuBarManager.app/Contents/Info.plist)" = "13.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' MenuBarManager.app/Contents/Info.plist)" = "MenuBarManager"
          codesign --verify --verbose MenuBarManager.app
